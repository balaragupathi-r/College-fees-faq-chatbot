<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>College Fees &amp; Scholarships FAQ Chatbot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div><h1>Fees &amp; Scholarships Assistant</h1><p>Ask me about college fees, payments and scholarships</p></div>
    <button id="clear">Clear chat</button>
  </header>
  <div id="chat" class="chat"></div>
  <div id="chips" class="chips"></div>
  <div class="input-row">
    <input id="input" type="text" placeholder="Type your question..." autocomplete="off">
    <button id="send">Send</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
